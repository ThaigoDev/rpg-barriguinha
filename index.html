<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Lenda dos Seis</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,210,140,.35);color:#f3d9a4;font:8px "Press Start 2P",monospace;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.tb.act{background:rgba(255,190,110,.3)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="tb" data-k="ArrowLeft" style="left:14px;bottom:34px">◀</div>
  <div class="tb" data-k="ArrowRight" style="left:78px;bottom:34px">▶</div>
  <div class="tb" data-k="ArrowDown" style="left:46px;bottom:94px">▼</div>
  <div class="tb" data-k="Space" style="right:14px;bottom:20px">PULO</div>
  <div class="tb" data-k="ShiftLeft" style="right:76px;bottom:20px">ROLA</div>
  <div class="tb" data-k="KeyJ" style="right:14px;bottom:82px">LEVE</div>
  <div class="tb" data-k="KeyK" style="right:76px;bottom:82px">FORTE</div>
  <div class="tb" data-k="KeyL" style="right:138px;bottom:50px">ESP</div>
  <div class="tb" data-k="KeyQ" style="right:14px;bottom:144px">CAFÉ</div>
  <div class="tb" data-k="KeyE" style="right:76px;bottom:144px">E</div>
  <div class="tb" data-k="Escape" style="right:14px;top:14px;width:40px;height:40px">☰</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
