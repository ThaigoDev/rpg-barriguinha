function tone(f,d,type='square',v=.08,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v=.1,fq=1200,type='lowpass'){if(!AC)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+.02);}

function drawHead(d,b,C,o){
 const y0=-24+b;
 R(C(d.skinS),-1,-17+b,3,1);
 if(d.hs==='mask'){R(C(d.hair),-5,y0-2,10,4);R(C(d.hair),-5,y0,3,8);R(C(d.skin),-2,y0+1,6,6);R(C(d.skinS),-2,y0+6,6,1);R(C('#9a9282'),2,y0+2,1,3);return;}
 if(d.hs==='helm'){R(C(d.hair),-4,y0-1,8,8);R(C('#6a707a'),-4,y0-1,8,1);R(C('#1a1c20'),0,y0+3,5,1);R(d.eye,3,y0+3,1,1);R(C('#4a4f58'),-4,y0+5,1,2);return;}

 R(C(d.skinS),-1,y0+3,1,2);
 R(C(d.skin),4,y0+3,1,2);R(C(d.skinS),4,y0+4,1,1);

 switch(d.hs){

  case 'straight':R(h,-4,y0-1,8,2);R(h,-3,y0-2,6,1);R(h,-4,y0+1,2,4);R(h,2,y0+1,3,1);break;
  case 'shortcurly':R(h,-3,y0-1,7,2);for(let i=-3;i<4;i+=2)R(h,i,y0-2,1,1);R(h,-4,y0,1,3);R(h,-3,y0+1,1,2);break;
  case 'bigcurly':R(h,-5,y0-3,10,4);for(let i=-5;i<5;i+=2)R(h,i,y0-4,1,1);R(h,-6,y0-2,1,4);R(h,-5,y0+1,2,3);R(h,4,y0-2,1,2);R(h,3,y0+1,1,1);break;

 }
 R(C(d.hair),1,y0+2,3,1);

 ctx.save();ctx.translate(1,-14+b);ctx.rotate(o.armA);
 R(C(d.outfit),-1,0,3,5);R(C(d.skin),-1,5,3,2);if(d.bracelet)R(C('#d0d0d0'),-1,4,3,1);
 drawWeapon(o.cup?'cup':d.weapon,C,o);

}

function drawDog(e){

function enemyPose(e){

 if(e.state==='chase'||(e.state==='idle'&&e.vx)){const ph=Math.sin(time*9+e.seed);o.legA=Math.round(ph*1.5);o.bob=Math.abs(ph)>.7?1:0;}
 else if(e.state==='idle')o.bob=Math.sin(time*2+e.seed)>0?0:1;

 b.t+=dt;b.flash=Math.max(0,b.flash-dt);

 if(P.state==='dead'&&b.state!=='rec'&&b.state!=='intro'){b.vx=0;}

 const choose=type=>{b.state='wind';b.t=0;b.atkType=type;b.face=Math.sign(dx)||b.face;b.wd={sweep:.62,slam:.85,leap:.5}[type]/sp;};
 const strike=(box,dmg)=>{if(!b.hitDone&&ov(box,pbox())){b.hitDone=true;hurtPlayer(dmg,b);}};
 switch(b.state){

  case 'wind':b.vx=0;if(b.t>=b.wd){b.state='atk';b.t=0;b.hitDone=false;
    if(b.atkType==='leap'){b.vy=-330;b.vx=clamp((P.x-b.x)/.73,-260,260);}else SFX.heavy();

     if(b.phase===2)projs.push({x:b.x+b.face*34,y:GY-12,vx:b.face*170,w:10,h:12,owner:'e',life:2.4,type:'shock',dmg:18});}}break;
  case 'atk':
   if(b.atkType==='sweep'){b.vx=b.face*60;if(b.t<.22)strike({x:b.face>0?b.x:b.x-64,y:b.y-48,w:64,h:48},24);
    if(b.t>=.3){if(b.phase===2&&!b.combo&&Math.random()<.45){b.combo=true;b.face=Math.sign(dx)||b.face;b.state='wind';b.t=b.wd*.4;break;}b.combo=false;b.state='rec';b.t=0;b.rd=.6/sp;}}
   else if(b.atkType==='slam'){b.vx=0;if(b.t<.15)strike({x:b.face>0?b.x+4:b.x-56,y:b.y-60,w:52,h:60},34);if(b.t>=.25){b.state='rec';b.t=0;b.rd=.85/sp;}}
   else if(b.atkType==='leap'){if(b.onGround&&b.t>.12){b.vx=0;SFX.slam();shake(.45,7);
     if(Math.abs(P.x-b.x)<52&&P.y>b.y-34)hurtPlayer(28,b);
     for(let i=0;i<20;i++)parts.push({x:b.x+(Math.random()-.5)*80,y:GY,vx:(Math.random()-.5)*90,vy:-50-Math.random()*90,life:.7,max:.7,c:'#7a6a55',g:300,s:2});
     if(b.phase===2)for(const s of[-1,1])projs.push({x:b.x+s*30,y:GY-12,vx:s*170,w:10,h:12,owner:'e',life:2.4,type:'shock',dmg:18});
     b.state='rec';b.t=0;b.rd=.8/sp;}}
   break;
  case 'rec':b.vx=0;if(b.t>=b.rd){b.state='walk';b.t=0;}break;
  case 'stun':b.vx=0;if(b.t>1.4){b.state='walk';b.t=0;}break;
 }
 physics(b,dt,[ARENA0+20,ARENA1-20]);

function bossPose(b){

 if(b.state==='walk'){const ph=Math.sin(time*7);o.legA=Math.round(ph*1.5);o.bob=Math.abs(ph)>.7?1:0;}
 else if(b.state==='wind')o.armA=lerp(-.9,b.atkType==='leap'?-3.0:-3.6,ease(b.t/b.wd));
 else if(b.state==='atk')o.armA=b.atkType==='leap'?(b.onGround?-.1:-3.2):lerp(-3.6,-.1,b.t/.12);

  if(p.x<0||p.x>WORLD)p.life=0;}

 }

function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
 if(scene==='title'){drawBG(titleCam);drawTitle();return;}
 if(scene==='select'){drawBG(time*12);drawSelect();return;}
 const sx=shakeT>0?(Math.random()-.5)*shakeM*2:0,sy=shakeT>0?(Math.random()-.5)*shakeM*2:0;
 drawBG(cam);
 ctx.save();ctx.translate(Math.round(-cam+sx),Math.round(sy));
 drawGround();
 FIRES.forEach((f,i)=>drawFire(f,S.lit[i]));
 for(const m of MSGS){ctx.globalAlpha=.55+.35*Math.sin(time*2+m.x);R('#e08a2a',m.x-6,GY-1,12,1);R('#ffb050',m.x-3,GY-2,6,1);ctx.globalAlpha=1;}
 for(const it of items){const y=it.y-7+Math.round(Math.sin(time*3+it.x)*2);const gl=ctx.createRadialGradient(it.x,y,1,it.x,y,10);gl.addColorStop(0,it.type==='cafe'?'rgba(255,200,120,.6)':'rgba(170,220,255,.6)');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(it.x-10,y-10,20,20);R(it.type==='cafe'?'#ffe0a0':'#e8f6ff',it.x-1,y-1,3,3);}
 if(S.stain){const s=S.stain;ctx.globalAlpha=.6+.3*Math.sin(time*4);R('#8a0a14',s.x-7,s.y-1,14,1);R('#c01020',s.x-4,s.y-2,8,1);ctx.globalAlpha=1;if(Math.random()<.2)parts.push({x:s.x+(Math.random()-.5)*10,y:s.y-2,vx:0,vy:-15,life:.8,max:.8,c:'#d02030',g:0,s:1});}
 drawCharAt(OLDMAN,NPC.x,GY,-1,{bob:Math.sin(time*1.2)>0?1:2,armA:.2,seed:9});
 if(boss&&!S.bossDead||boss&&boss.state==='dead'){
  if(boss.state!=='dead'){for(const gx of arenaOn?[ARENA0,ARENA1]:[ARENA0]){for(let i=0;i<6;i++){ctx.globalAlpha=.10+.06*Math.sin(time*2+i);R('#e8e8ff',gx-6+Math.sin(time*1.5+i)*3,GY-90+i*14,12,16);}ctx.globalAlpha=1;}}
 }
 for(const e of enemies){if(e.type==='dog')drawDog(e);else drawCharAt(e.def,e.x,e.y,e.face,enemyPose(e),1,e.alpha);
  if(e.hp<e.maxhp&&e.state!=='dead'){R('#000',e.x-9,e.y-e.h-8,18,3);R('#a01822',e.x-8,e.y-e.h-7,Math.round(16*e.hp/e.maxhp),1);}}
 if(boss){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(boss.x-18,GY-1,36,2);drawCharAt(BOSSD,boss.x,boss.y,boss.face,bossPose(boss),2.3,boss.alpha);}
 if(P.state!=='dead'||scene==='dead')drawCharAt(P.d,P.x,P.y,P.face,playerPose());
 if(P.critNext&&Math.floor(time*8)%2)R('#ffe080',P.x-1,P.y-34,2,2);
 for(const p of projs){if(p.type==='fire'){R('#ff6020',p.x-4,p.y-3,8,6);R('#ffb030',p.x-3,p.y-2,6,4);R('#fff0b0',p.x-1,p.y-1,3,2);}else{R('#b8a8ff',p.x-4,p.y,8,12);R('#ffffff',p.x-2,p.y+3,4,9);}}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);R(p.c,Math.round(p.x),Math.round(p.y),p.s,p.s);}ctx.globalAlpha=1;
 for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*2);txt(t.s,Math.round(t.x),Math.round(t.y),8,t.c,'center');}ctx.globalAlpha=1;
 if(near&&scene==='game'&&!menu&&!dialog){const nx=near.type==='fire'?FIRES[near.i].x:near.type==='npc'?NPC.x:near.m.x;txt('[E] '+near.label,Math.round(nx),GY-50,8,'#ffe0a0','center');}
 ctx.restore();
 for(let i=0;i<5;i++){const fx=((i*131+time*(6+i*3))%(W+160))-80;ctx.fillStyle='rgba(160,150,190,.045)';ctx.beginPath();ctx.ellipse(fx,GY-10+(i%3)*12,70,10,0,0,7);ctx.fill();}
 if(!vig){vig=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.6)');}
 ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
 drawHUD();drawBanner();
 if(dialog)drawDialog();if(menu)drawMenu();
 if(scene==='dead')drawDeath();if(scene==='victory')drawVictory();
}
function bar(x,y,w,h,v,max,c,lag){R('#000',x-1,y-1,w+2,h+2);R('#2a1a1a',x,y,w,h);if(lag!=null)R('#d8b060',x,y,Math.round(w*clamp(lag/max,0,1)),h);R(c,x,y,Math.round(w*clamp(v/max,0,1)),h);R('rgba(255,255,255,.18)',x,y,Math.round(w*clamp(v/max,0,1)),1);}
function drawHUD(){
 txt(P.d.short+'  NV '+S.lv,8,6,8,'#e8dcc0');
 bar(8,17,Math.round(50+P.maxhp*.7),5,P.hp,P.maxhp,'#a01822',P.hpLag);
 bar(8,25,Math.round(40+P.maxst*.6),3,Math.max(0,P.st),P.maxst,'#2e8a3a');
 R('#e8e0d0',9,33,6,6);R('#5a3418',10,33,4,1);R('#e8e0d0',15,34,2,3);txt('x'+P.cafe,20,33,8,P.cafe?'#e8dcc0':'#7a6a5a');
 if(P.buffT>0)txt('MALDIÇÃO '+Math.ceil(P.buffT)+'s',8,45,8,'#c080ff');
 if(P.critNext)txt('PRÓXIMO: CRÍTICO',8,P.buffT>0?56:45,8,'#ffe080');
 const sv=String(S.souls);R('rgba(0,0,0,.6)',W-96,6,88,18);R('#5a4a30',W-96,23,88,1);txt(sv,W-14,11,8,'#e8dcc0','right');R('#9fd8ff',W-90,13,3,3);txt('ALMAS',W-84,11,8,'#7a8a9a');
 if(boss&&arenaOn&&boss.state!=='dead'){txt(boss.name,W/2-150,H-34,8,'#e8dcc0');bar(W/2-150,H-22,300,5,boss.hp,boss.maxhp,'#8a1420');}
 if(hintT>0&&!arenaOn){ctx.globalAlpha=Math.min(1,hintT);txt('J leve  K forte  L especial  SHIFT rola  Q café  E usa',W/2,62,8,'#c8b898','center');ctx.globalAlpha=1;}
}
function drawBanner(){
 if(!banner)return;const b=banner,a=b.t<.4?b.t/.4:b.t>b.dur-.6?Math.max(0,(b.dur-b.t)/.6):1;
 ctx.globalAlpha=a;R('rgba(0,0,0,.55)',0,92,W,50);R('rgba(200,170,110,.35)',60,92,W-120,1);R('rgba(200,170,110,.35)',60,141,W-120,1);
 txt(b.text,W/2,102,16,b.color||'#e8dcc0','center');if(b.sub)txt(b.sub,W/2,125,8,'#b8a888','center');ctx.globalAlpha=1;
}
function panel(x,y,w,h){R('rgba(8,6,12,.92)',x,y,w,h);R('#6a5a3a',x,y,w,1);R('#6a5a3a',x,y+h-1,w,1);R('#6a5a3a',x,y,1,h);R('#6a5a3a',x+w-1,y,1,h);R('#a08a5a',x+2,y+2,3,1);R('#a08a5a',x+w-5,y+2,3,1);}
function drawDialog(){
 panel(16,190,W-32,70);txt(dialog.who,26,198,8,'#e0b070');
 const lines=wrap(dialog.lines[dialog.i],W-60);lines.forEach((l,i)=>txt(l,26,214+i*12,8,'#e8dcc0'));
 if(Math.floor(time*3)%2)txt('▼',W-32,248,8,'#e0b070');
}
function drawMenu(){
 const m=menu,w=m.level?300:220,h=m.level?150:m.pause?150:30+m.opts.length*16+10,x=(W-w)/2,y=m.level?60:70;
 panel(x,y,w,h);txt(m.title,W/2,y+10,8,'#e0b070','center');
 let oy=y+30;
 if(m.level){txt('Nível '+S.lv+'   Almas '+S.souls,x+14,oy,8,'#e8dcc0');txt('Custo: '+levelCost()+' almas',x+14,oy+12,8,S.souls>=levelCost()?'#9fd8ff':'#c06050');oy+=32;}
 m.opts.forEach((o,i)=>{txt((i===m.idx?'▶ ':'  ')+o.label,x+14,oy+i*16,8,i===m.idx?'#ffe0a0':'#a89878');});
 if(m.level&&m.msg)txt(m.msg,W/2,y+h-16,8,'#ffd27a','center');
 if(m.pause){const L=['A/D ←→ mover   W/↑/ESPAÇO pular','↓ + pular: descer da plataforma','SHIFT rolar   J leve   K forte','L especial   Q café   E interagir'];L.forEach((l,i)=>txt(l,x+10,y+76+i*12,8,'#8a7a5a'));}
}
function drawDeath(){
 const a=Math.min(1,deathT/1.2);ctx.globalAlpha=a*.7;R('#000',0,0,W,H);ctx.globalAlpha=a;R('rgba(0,0,0,.7)',0,100,W,64);
 txt('VOCÊ MORREU',W/2,112,24,'#a01822','center');txt(deathMsg,W/2,144,8,'#b8a888','center');
 if(deathT>2&&Math.floor(time*2)%2)txt('ENTER para voltar à fogueira',W/2,180,8,'#e8dcc0','center');ctx.globalAlpha=1;
}
function drawVictory(){
 ctx.globalAlpha=.75;R('#000',0,0,W,H);ctx.globalAlpha=1;panel(40,50,W-80,170);
 txt('FIM DO CAPÍTULO 1',W/2,66,16,'#ffd27a','center');
 const L=wrap('O Guardião Sem Rosto caiu. Por trás da máscara... não tinha nada. Literalmente sem rosto. O nome era auto explicativo.\n\nMas um rastro de folhas secas leva à Floresta de Neversk, onde algo caça na escuridão.',W-110);
 L.forEach((l,i)=>txt(l,56,94+i*12,8,'#e8dcc0'));
 txt('PRÓXIMO: FLORESTA DE NEVERSK (em breve)',W/2,192,8,'#9fd8ff','center');
 if(Math.floor(time*2)%2)txt('ENTER para continuar explorando',W/2,206,8,'#a89878','center');
}
function drawTitle(){
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);R('#17120e',0,GY,W,H-GY);
 drawCharAt(CHARS[0],W/2-50,GY,1,{bob:Math.sin(time*3)>0?0:1,armA:-.9,seed:1});
 drawFire({x:W/2},true);
 txt('A LENDA',W/2,46,24,'#e8dcc0','center');txt('DOS SEIS',W/2,78,24,'#e8dcc0','center');
 txt('um soulslike de Neversk',W/2,112,8,'#b8a888','center');txt('Capítulo 1: Vila dos Esquecidos',W/2,126,8,'#8a7a5a','center');
 if(Math.floor(time*2)%2)txt('Aperte ENTER',W/2,160,8,'#ffe0a0','center');
 if(Math.random()<.3)parts.push({x:W/2+(Math.random()-.5)*8,y:GY-8,vx:(Math.random()-.5)*10,vy:-25,life:1.2,max:1.2,c:'#ffa040',g:-5,s:1});
 for(const p of parts){p.x+=p.vx/60;p.y+=p.vy/60;p.life-=1/60;ctx.globalAlpha=Math.max(0,p.life/p.max);R(p.c,Math.round(p.x),Math.round(p.y),1,1);}ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);
}
function drawSelect(){
 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
 txt('ESCOLHA SEU GUERREIRO',W/2,8,8,'#e0b070','center');
 for(let i=0;i<6;i++){const x=14+i*76,y=22,sel=i===selIdx;R(sel?'rgba(90,60,30,.6)':'rgba(20,16,26,.8)',x,y,72,72);R(sel?'#e0b070':'#4a3e2e',x,y,72,1);R(sel?'#e0b070':'#4a3e2e',x,y+71,72,1);R(sel?'#e0b070':'#4a3e2e',x,y,1,72);R(sel?'#e0b070':'#4a3e2e',x+71,y,1,72);
  drawCharAt(CHARS[i],x+36,y+62,1,{bob:sel&&Math.sin(time*4)>0?1:0,armA:sel?-.9+Math.sin(time*3)*.1:-.9,seed:i,noShadow:true},2);
  txt(CHARS[i].short,x+36,y+63,8,sel?'#ffe0a0':'#a89878','center');}
 const d=CHARS[selIdx],cs=charSave(d.id);
 panel(10,100,W-20,160);
 const atk=['attack','idle'][Math.floor(time/1.6)%2];
 let pose={bob:Math.sin(time*3)>0?0:1,armA:-.9,seed:1,noShadow:true};
 if(atk==='attack'){const tt=(time%1.6)/1.6;pose.armA=tt<.3?lerp(-.9,-3.3,ease(tt/.3)):tt<.45?lerp(-3.3,-.2,(tt-.3)/.15):lerp(-.2,-.9,(tt-.45)/.55);}
 R('rgba(0,0,0,.35)',22,112,92,140);drawCharAt(d,68,236,1,pose,3.4);
 const X=126;txt(d.name,X,110,8,'#ffe0a0');txt(d.title+' · '+d.cls,X,122,8,'#b8a888');
 const stat=(lb,v,mx,y)=>{txt(lb,X,y,8,'#8a7a5a');R('#2a2018',X+66,y+1,120,5);R('#c09050',X+66,y+1,Math.round(120*v/mx),5);};
 stat('VIDA',d.hp,140,138);stat('VIGOR',d.st,115,148);stat('DANO',d.dmg*(1/d.light.dur),40,158);stat('AGIL.',d.spd,110,168);
 txt(d.sp,X,182,8,'#c080ff');wrap(d.spd_,W-X-24).forEach((l,i)=>txt(l,X,194+i*11,8,'#d8ccb0'));
 wrap('"'+d.tag+'"',W-X-24).forEach((l,i)=>txt(l,X,228+i*11,8,'#8a7a5a'));
 if(cs.lv>1||cs.souls>0)txt('NV '+cs.lv+' · '+cs.souls+' almas',W-20,110,8,'#9fd8ff','right');
 txt('←/→ escolher   ENTER jogar',W/2,262-0,8,Math.floor(time*2)%2?'#e0b070':'#a08060','center');
}

// ================== TOQUE ==================
const touchOn=matchMedia('(pointer:coarse)').matches;
if(touchOn)document.getElementById('touch').classList.add('on');
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
 const down=e=>{e.preventDefault();audio();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('act');if(k==='KeyE'){pressed.Enter=true;}};
 const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('act');};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);});
cv.addEventListener('pointerdown',e=>{audio();const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)/r.width*W,gy=(e.clientY-r.top)/r.height*H;
 if(scene==='select'&&gy>=22&&gy<=94){const i=Math.floor((gx-14)/76);if(i>=0&&i<6){if(i===selIdx)pressed.Enter=true;else{selIdx=i;SFX.blip();}}return;}
 if(scene==='select'&&gy>94){pressed.Enter=true;return;}
 if(scene!=='game'||dialog)pressed.Enter=true;});

(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(frame));
</script>
